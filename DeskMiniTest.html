<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: sans-serif;
  background: linear-gradient(#0a3d8f, #0f5bd3);
  color: white;
  text-align: center;
}

.container {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 100px;
}

.card {
  background: white;
  color: black;
  border-radius: 20px;
  padding: 30px;
  width: 250px;
  cursor: pointer;
}

.card:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>How can we help you today?</h1>
<p>Select an option below for IT assistance.</p>

<div class="container">
  <div class="card" onclick="dial('1001')">
    <h2>Technical Help</h2>
    <p>Get help with an IT issue</p>
  </div>

  <div class="card" onclick="dial('1002')">
    <h2>Front Desk</h2>
    <p>Check in or speak with staff</p>
  </div>

  <div class="card" onclick="dial('1003')">
    <h2>Device Appointment</h2>
    <p>Schedule device support</p>
  </div>
</div>

<script>
function dial(number) {
  window.location.href = "sip:" + number;
}
</script>

</body>
</html>
