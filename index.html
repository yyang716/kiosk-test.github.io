<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Madera County IT Kiosk Dialer</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top, #5aa9ff 0%, #3b82f6 60%, #2563eb 100%);
  color: white;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
button, a { -webkit-tap-highlight-color: transparent; }
.logo { position: absolute; top: 30px; left: 45px; width: 240px; z-index: 10; }
.time { position: absolute; top: 45px; right: 55px; font-size: 40px; font-weight: 600; z-index: 10; }
.screen { display: none; width: 100vw; height: 100vh; padding-top: 1px; }
.screen.active { display: block; }
h1 { margin: 145px 0 12px; text-align: center; font-size: 72px; font-weight: 800; }
.subtitle { text-align: center; font-size: 36px; color: rgba(255,255,255,.80); margin-bottom: 50px; }
.container { display: flex; justify-content: center; gap: 34px; }
.card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 360px; height: 330px; padding: 30px;
  border: 0; border-radius: 24px; background: #fff; color: #14213d;
  text-decoration: none; text-align: center; cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,.22);
}
.card:active, .key:active, .menu-button:active, .call-button:active { transform: scale(.97); }
.icon-image { width: 150px; height: 150px; object-fit: contain; margin-bottom: 18px; }
.card h2 { margin: 0 0 12px; font-size: 29px; font-weight: 800; }
.card p { margin: 0; font-size: 21px; color: #4b5563; }
.menu-button {
  position: fixed; left: 40px; bottom: 40px; z-index: 20;
  border: 0; border-radius: 14px; padding: 17px 25px;
  background: #fff; color: #14213d; font-size: 23px; font-weight: 700; cursor: pointer;
}
.dialer-title { margin-top: 110px; }
.keypad-panel {
  width: 660px; margin: 20px auto 0; padding: 24px;
  border-radius: 24px; background: #fff; color: #14213d;
  box-shadow: 0 8px 18px rgba(0,0,0,.22);
}
.extension-display {
  width: 100%; height: 78px; margin-bottom: 18px;
  border: 2px solid #cbd5e1; border-radius: 14px;
  background: #f8fafc; color: #14213d; text-align: center;
  font-size: 44px; font-weight: 700; letter-spacing: 5px;
}
.keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.key {
  min-height: 72px; border: 0; border-radius: 14px;
  background: #e9eef5; color: #14213d; font-size: 31px; font-weight: 700; cursor: pointer;
}
.key.utility { font-size: 22px; background: #d8e0ea; }
.call-button {
  display: block; width: 100%; margin-top: 17px; padding: 20px;
  border-radius: 14px; background: #16783a; color: #fff;
  text-decoration: none; text-align: center; font-size: 29px; font-weight: 800;
}
.call-button.disabled { background: #94a3b8; }
.message { min-height: 27px; margin-top: 12px; text-align: center; font-size: 19px; color: #b42318; }
</style>
</head>
<body>

<img class="logo" src="assets/MCWhite.png" alt="Madera County Logo">
<div class="time" id="clock"></div>

<section id="homeScreen" class="screen active">
  <h1>How can we help you today?</h1>
  <p class="subtitle">Select an option below for IT assistance.</p>

  <div class="container">
    <button type="button" id="openDialerButton" class="card">
      <img class="icon-image" src="assets/headset.png" alt="">
      <h2>Dial an Extension</h2>
      <p>Enter a county extension to place a call</p>
    </button>

    <a class="card" href="sip:2002170">
      <img class="icon-image" src="assets/frontdesk.png" alt="">
      <h2>Front Desk</h2>
      <p>Check in or speak with staff</p>
    </a>

    <a class="card" href="sip:2006181">
      <img class="icon-image" src="assets/appointment.png" alt="">
      <h2>Appointment</h2>
      <p>Appointment for device enrollment</p>
    </a>
  </div>
</section>

<section id="dialerScreen" class="screen">
  <button type="button" id="mainMenuButton" class="menu-button">&#8592; Main Menu</button>
  <h1 class="dialer-title">Dial an Extension</h1>
  <p class="subtitle">Enter the extension, then select Call Extension.</p>

  <div class="keypad-panel">
    <input id="extensionDisplay" class="extension-display" type="text" inputmode="numeric" readonly aria-label="Extension">

    <div class="keypad-grid">
      <button type="button" class="key number-key" data-number="1">1</button>
      <button type="button" class="key number-key" data-number="2">2</button>
      <button type="button" class="key number-key" data-number="3">3</button>
      <button type="button" class="key number-key" data-number="4">4</button>
      <button type="button" class="key number-key" data-number="5">5</button>
      <button type="button" class="key number-key" data-number="6">6</button>
      <button type="button" class="key number-key" data-number="7">7</button>
      <button type="button" class="key number-key" data-number="8">8</button>
      <button type="button" class="key number-key" data-number="9">9</button>
      <button type="button" id="clearButton" class="key utility">Clear</button>
      <button type="button" class="key number-key" data-number="0">0</button>
      <button type="button" id="backspaceButton" class="key utility">Backspace</button>
    </div>

    <a id="callExtensionLink" class="call-button disabled" href="sip:">Call Extension</a>
    <div id="dialMessage" class="message"></div>
  </div>
</section>

<script>
(function () {
  'use strict';

  var homeScreen = document.getElementById('homeScreen');
  var dialerScreen = document.getElementById('dialerScreen');
  var display = document.getElementById('extensionDisplay');
  var callLink = document.getElementById('callExtensionLink');
  var message = document.getElementById('dialMessage');
  var maxDigits = 10;

  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  function showDialer() {
    homeScreen.classList.remove('active');
    dialerScreen.classList.add('active');
    clearExtension();
  }

  function showHome() {
    dialerScreen.classList.remove('active');
    homeScreen.classList.add('active');
    clearExtension();
  }

  function updateCallLink() {
    var extension = display.value;
    callLink.setAttribute('href', extension ? 'sip:' + extension : 'sip:');
    callLink.classList.toggle('disabled', extension.length === 0);
    message.textContent = '';
  }

  function addDigit(number) {
    if (display.value.length < maxDigits) {
      display.value += number;
      updateCallLink();
    }
  }

  function clearExtension() {
    display.value = '';
    updateCallLink();
  }

  function backspace() {
    display.value = display.value.slice(0, -1);
    updateCallLink();
  }

  document.getElementById('openDialerButton').addEventListener('click', showDialer);
  document.getElementById('mainMenuButton').addEventListener('click', showHome);
  document.getElementById('clearButton').addEventListener('click', clearExtension);
  document.getElementById('backspaceButton').addEventListener('click', backspace);

  var numberKeys = document.querySelectorAll('.number-key');
  for (var i = 0; i < numberKeys.length; i++) {
    numberKeys[i].addEventListener('click', function () {
      addDigit(this.getAttribute('data-number'));
    });
  }

  callLink.addEventListener('click', function (event) {
    var extension = display.value;

    if (!/^\d{4,10}$/.test(extension)) {
      event.preventDefault();
      message.textContent = 'Enter a valid extension containing 4 to 10 digits.';
      return false;
    }

    /* The link remains a real sip: hyperlink so RoomOS can process it directly. */
    callLink.setAttribute('href', 'sip:' + extension);
    return true;
  });

  updateClock();
  setInterval(updateClock, 30000);
}());
</script>
</body>
</html>
